version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: don-felipe-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: donfelipe
      POSTGRES_PASSWORD: donfelipe123
      POSTGRES_DB: donfelipe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: don-felipe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
